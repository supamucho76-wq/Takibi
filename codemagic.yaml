workflows:
  ios-simulator:
    name: iOS Simulator Build
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      xcode: 16.4
    scripts:
      - name: Install XcodeGen
        script: |
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
      - name: Generate project
        script: xcodegen generate
      - name: Build unsigned simulator app
        script: |
          set -o pipefail
          mkdir -p build
          xcodebuild build \
            -project Takibi.xcodeproj \
            -scheme Takibi \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            -derivedDataPath build/DerivedData \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            | tee build/xcodebuild.log
    artifacts:
      - build/xcodebuild.log
      - build/DerivedData/Build/Products/Debug-iphonesimulator/*.app
      - build/DerivedData/Build/Products/Debug-iphonesimulator/*.dSYM

  ios-testflight:
    name: Signed TestFlight Build
    instance_type: mac_mini_m2
    max_build_duration: 45
    integrations:
      app_store_connect: codemagic_api_key
    triggering:
      events:
        - tag
    environment:
      xcode: 26.4
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.supamucho76.takibi
      vars:
        BUNDLE_ID: com.supamucho76.takibi
        XCODE_PROJECT: Takibi.xcodeproj
        XCODE_SCHEME: Takibi
    scripts:
      - name: Install XcodeGen
        script: |
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
      - name: Generate project
        script: xcodegen generate
      - name: Install Metal Toolchain
        script: xcodebuild -downloadComponent metalToolchain
      - name: Configure signing
        script: xcode-project use-profiles
      - name: Build signed IPA
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
      - name: Verify app icon in IPA
        script: |
          set -euo pipefail
          IPA_PATH=$(find build/ios/ipa -name '*.ipa' -print -quit)
          test -n "$IPA_PATH"
          rm -rf build/ipa-check
          mkdir -p build/ipa-check
          unzip -q "$IPA_PATH" -d build/ipa-check
          APP_PATH=$(find build/ipa-check/Payload -maxdepth 1 -name '*.app' -print -quit)
          test -n "$APP_PATH"
          ICON_NAME=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIconName' "$APP_PATH/Info.plist")
          test "$ICON_NAME" = "AppIcon"
          test -f "$APP_PATH/Icon-60@2x.png"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
